<div class="recipe-page-heading">
  <a class="back-link" routerLink="/">← Back to Home</a>
  @if (recipeTitle !== null) {
    <h1 class="recipe-page-title">
      @if (isEditingRecipeTitle) {
        <input
          class="recipe-title-input"
          type="text"
          aria-label="Recipe title"
          [(ngModel)]="recipeTitleDraft"
          (keydown.enter)="$event.preventDefault(); acceptRecipeTitle()"
          (keydown.escape)="cancelRecipeTitleEditing()"
          autofocus
        />
        <button
          class="recipe-title-action save-title-action"
          type="button"
          aria-label="Save recipe title"
          title="Save"
          [disabled]="!recipeTitleDraft.trim()"
          (click)="acceptRecipeTitle()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m5 12 4 4L19 6" />
          </svg>
        </button>
        <button
          class="recipe-title-action cancel-title-action"
          type="button"
          aria-label="Cancel title edit"
          title="Cancel"
          (click)="cancelRecipeTitleEditing()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m18 6-12 12M6 6l12 12" />
          </svg>
        </button>
      } @else {
        <button
          class="recipe-title-trigger"
          type="button"
          aria-label="Edit recipe title"
          title="Edit recipe title"
          (click)="startEditingRecipeTitle()"
        >
          <span>{{ recipeTitle }}</span>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z" />
          </svg>
        </button>
      }
    </h1>
    <div class="recipe-page-actions">
      <button
        class="pdf-button recipe-page-pdf-button"
        type="button"
        aria-label="Download Yours recipe as PDF"
        title="Download as PDF"
        (click)="requestPdf()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 2h8l5 5v15H6z" />
          <path d="M14 2v6h6" />
          <text x="7" y="17" font-size="5">PDF</text>
        </svg>
      </button>
      <button
        class="recipe-page-save-button"
        type="button"
        aria-label="Save to Recipe Perfector"
        title="Save to Recipe Perfector"
        (click)="saveRecipe()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 3h12l4 4v14H3V5a2 2 0 0 1 2-2Z" />
          <path d="M7 3v6h10V3" />
          <path d="M7 21v-8h10v8" />
        </svg>
      </button>
    </div>
  } @else {
    <span class="recipe-page-heading-spacer" aria-hidden="true"></span>
    <span class="recipe-page-heading-spacer" aria-hidden="true"></span>
  }
</div>
