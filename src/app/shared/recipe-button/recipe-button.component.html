<button
  [class]="btnClass"
  [attr.type]="type"
  [attr.aria-label]="ariaLabel"
  [attr.title]="title"
  (click)="onClick()"
  [disabled]="isButtonLoading || disabled"
>
  @if (isButtonLoading) {
    <span class="loading-spinner" aria-hidden="true"></span>
  }
  <ng-content></ng-content>
</button>
