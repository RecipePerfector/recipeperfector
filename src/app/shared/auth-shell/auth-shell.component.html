<header class="app-header">
  <div class="brand">Recipe Perfector</div>
  <p class="eyebrow">Crowd Source Recipe Perfection</p>
  <button class="user-menu" type="button" (click)="openLoginDialog()">
    <span class="user-avatar" aria-hidden="true">
      @if (isLoggedIn && userImageUrl) {
        <img [src]="userImageUrl" alt="User profile" />
      } @else {
        <span class="guest-icon">👤</span>
      }
    </span>
    <span class="user-label">{{ isLoggedIn ? 'Account' : 'Login' }}</span>
  </button>
</header>

@if (isLoginDialogOpen) {
  <div class="login-dialog-backdrop">
    <div class="login-dialog" role="dialog" aria-modal="true" aria-labelledby="login-dialog-title" (click)="$event.stopPropagation()">
      <h2 id="login-dialog-title">{{ accountMode === 'create' ? 'Create an Account' : 'Sign in' }}</h2>
      @if (confirmationText) {
        <p class="login-confirmation">{{ confirmationText }}</p>
        <div class="login-actions">
          <button type="button" class="primary-btn" (click)="closeLoginDialog()">Close</button>
        </div>
      } @else {
        <div class="login-mode-group" role="radiogroup" aria-label="Choose account mode">
          <label class="login-toggle">
            <input type="radio" [value]="'create'" [(ngModel)]="accountMode" name="accountMode" />
            <span>Create an account</span>
          </label>
          <label class="login-toggle">
            <input type="radio" [value]="'existing'" [(ngModel)]="accountMode" name="accountMode" />
            <span>Sign-in to existing account</span>
          </label>
        </div>
        @if (accountMode === 'existing') {
          <label class="login-toggle">
            <input type="checkbox" [(ngModel)]="usePasswordless" name="usePasswordless" />
            <span>Use passwordless sign-in</span>
          </label>
        }
        <label class="login-field">
          <span>E-mail</span>
          <input type="text" [(ngModel)]="username" name="username" />
        </label>
        @if (!usePasswordless) {
          <label class="login-field">
            <span>Password</span>
            <input type="password" [(ngModel)]="password" name="password" />
          </label>
        }
        <div class="login-actions">
          <button type="button" class="secondary-btn" (click)="closeLoginDialog()">Cancel</button>
          <button type="button" class="primary-btn" (click)="submitLogin()">{{ accountMode === 'create' ? 'Create an Account' : usePasswordless ? 'Send e-mail code' : 'Sign in' }}</button>
        </div>
      }
    </div>
  </div>
}
